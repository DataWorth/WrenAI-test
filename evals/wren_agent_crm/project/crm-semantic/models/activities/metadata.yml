name: activities
table_reference:
  catalog: ''
  schema: crm_demo
  table: activities
properties:
  description: "活动记录 (activities) — sales and service activities such as calls, tasks, and follow-ups logged against accounts, contacts, or opportunities. Communication/activity table — not a business entity."
columns:
- name: activity_id
  type: BIGINT
  not_null: true
  properties:
    description: "Primary key — unique identifier. Join key only."
- name: record_name
  type: VARCHAR(180)
  not_null: true
  properties:
    description: "活动名称 (activity name or subject)."
- name: status
  type: VARCHAR(40)
  not_null: true
  properties:
    description: "Test placeholder status. In this activity table, status is not a business metric."
- name: region
  type: VARCHAR(30)
  not_null: true
  properties:
    description: "Test placeholder region. In this activity table, region is not a valid analysis dimension."
- name: source
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder source. In this activity table, source is not a valid analysis dimension."
- name: industry
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder industry. In this activity table, industry is not a valid analysis dimension."
- name: stage
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder stage."
- name: amount
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "Test placeholder amount. [unit] Not a CNY business amount — do not use for revenue metrics."
- name: probability
  type: DECIMAL(6, 2)
  not_null: true
  properties:
    description: "Test placeholder probability. Not the win probability — only opportunities.probability has business meaning."
- name: quantity
  type: INT
  not_null: true
  properties:
    description: "Test placeholder quantity."
- name: unit_price
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "Test placeholder unit price."
- name: score
  type: DECIMAL(8, 2)
  not_null: true
  properties:
    description: "Test placeholder score. Not the customer health score — only customer_health_scores.score has business meaning."
- name: created_at
  type: DATETIME
  not_null: true
  properties:
    description: "Record creation timestamp. [time] Business timezone: Asia/Shanghai (UTC+8)."
- name: account_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to accounts — related account. Join key only."
- name: contact_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to contacts — related contact. Join key only."
- name: opportunity_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to opportunities — related opportunity. Join key only."
- name: owner_user_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to crm_users — the activity owner. Join key only."
primary_key: activity_id
