name: payments
table_reference:
  catalog: ''
  schema: crm_demo
  table: payments
properties:
  description: "实收 (payments) — actual payments received from customers against invoices. Each payment represents a cash receipt or payment settlement."
columns:
- name: payment_id
  type: BIGINT
  not_null: true
  properties:
    description: "Primary key — unique identifier for the payment record. Join key only, not a business document number."
- name: record_name
  type: VARCHAR(180)
  not_null: true
  properties:
    description: "付款记录名称 (payment name or reference)."
- name: status
  type: VARCHAR(40)
  not_null: true
  properties:
    description: "付款状态 (payment status). [enum] Demo placeholder values — not interpreted as consistent business semantics."
- name: region
  type: VARCHAR(30)
  not_null: true
  properties:
    description: "销售大区 (sales region). [enum] Valid values: 华东, 华北, 华南, 华中, 西南. Analysis dimension for payment regional distribution."
- name: source
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "获客或创建来源 (acquisition or creation source). [enum] Valid values: 官网咨询, 行业峰会, 渠道伙伴, 客户转介绍, 内容营销. Analysis dimension inherited from upstream business entity."
- name: industry
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "客户所属行业 (customer industry). Analysis dimension inherited from upstream business entity."
- name: stage
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Payment stage. [enum] Demo placeholder values — not interpreted as consistent business semantics."
- name: amount
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "付款金额 (payment amount). [unit] CNY pre-tax demo amount. Do not aggregate across different document types."
- name: probability
  type: DECIMAL(6, 2)
  not_null: true
  properties:
    description: "Test placeholder probability. Not the win probability — only opportunities.probability has business meaning."
- name: quantity
  type: INT
  not_null: true
  properties:
    description: "Test placeholder quantity."
- name: unit_price
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "Test placeholder unit price."
- name: score
  type: DECIMAL(8, 2)
  not_null: true
  properties:
    description: "Test placeholder score. Not the customer health score — only customer_health_scores.score has business meaning."
- name: created_at
  type: DATETIME
  not_null: true
  properties:
    description: "Record creation timestamp. [time] Business timezone: Asia/Shanghai (UTC+8)."
- name: invoice_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to invoices — the invoice this payment is applied against. Join key only."
primary_key: payment_id
