name: quote_items
table_reference:
  catalog: ''
  schema: crm_demo
  table: quote_items
properties:
  description: "报价明细行 (quote items) — individual line items within a quote, each representing a product with pricing. CNY amount fields are business-relevant."
columns:
- name: quote_item_id
  type: BIGINT
  not_null: true
  properties:
    description: "Primary key — unique identifier. Join key only."
- name: record_name
  type: VARCHAR(180)
  not_null: true
  properties:
    description: "报价行名称 (quote item name or description)."
- name: status
  type: VARCHAR(40)
  not_null: true
  properties:
    description: "Test placeholder status. Demo placeholder values — not interpreted as consistent business semantics."
- name: region
  type: VARCHAR(30)
  not_null: true
  properties:
    description: "Test placeholder region. In this line-item table, region is not a valid analysis dimension."
- name: source
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder source. In this line-item table, source is not a valid analysis dimension."
- name: industry
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder industry. In this line-item table, industry is not a valid analysis dimension."
- name: stage
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder stage."
- name: amount
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "报价行金额 (quote item amount). [unit] CNY pre-tax demo amount. Do not aggregate across different document types."
- name: probability
  type: DECIMAL(6, 2)
  not_null: true
  properties:
    description: "Test placeholder probability. Not the win probability — only opportunities.probability has business meaning."
- name: quantity
  type: INT
  not_null: true
  properties:
    description: "件数 (piece count / quantity). Number of units in this line item."
- name: unit_price
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "单价 (unit price). [unit] CNY price per unit."
- name: score
  type: DECIMAL(8, 2)
  not_null: true
  properties:
    description: "Test placeholder score. Not the customer health score — only customer_health_scores.score has business meaning."
- name: created_at
  type: DATETIME
  not_null: true
  properties:
    description: "Record creation timestamp. [time] Business timezone: Asia/Shanghai (UTC+8)."
- name: quote_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to quotes — the parent quote. Join key only."
- name: product_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to products — the product in this line. Join key only."
primary_key: quote_item_id
