name: contracts
table_reference:
  catalog: ''
  schema: crm_demo
  table: contracts
properties:
  description: "合同 (contracts) — signed agreements with customers that formalize terms and commitments. Each contract is associated with an account and may originate from an opportunity."
columns:
- name: contract_id
  type: BIGINT
  not_null: true
  properties:
    description: "Primary key — unique identifier for the contract record. Join key only, not a business document number."
- name: record_name
  type: VARCHAR(180)
  not_null: true
  properties:
    description: "合同名称 (contract name or title)."
- name: status
  type: VARCHAR(40)
  not_null: true
  properties:
    description: "合同状态 (contract status). [enum] Demo placeholder values — not interpreted as consistent business semantics."
- name: region
  type: VARCHAR(30)
  not_null: true
  properties:
    description: "销售大区 (sales region). [enum] Valid values: 华东, 华北, 华南, 华中, 西南. Analysis dimension for contract regional distribution."
- name: source
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "获客或创建来源 (acquisition or creation source). [enum] Valid values: 官网咨询, 行业峰会, 渠道伙伴, 客户转介绍, 内容营销. Analysis dimension for contract source tracking."
- name: industry
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "客户所属行业 (customer industry). Analysis dimension for market segmentation."
- name: stage
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Contract stage. [enum] Demo placeholder values — not interpreted as consistent business semantics."
- name: amount
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "合同金额 (contract amount). [unit] CNY pre-tax demo amount. Do not aggregate across different document types."
- name: probability
  type: DECIMAL(6, 2)
  not_null: true
  properties:
    description: "Test placeholder probability. Not the win probability — only opportunities.probability has business meaning."
- name: quantity
  type: INT
  not_null: true
  properties:
    description: "件数 (piece count / quantity). Number of units or line items in the contract."
- name: unit_price
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "单价 (unit price). [unit] CNY price per unit."
- name: score
  type: DECIMAL(8, 2)
  not_null: true
  properties:
    description: "Test placeholder score. Not the customer health score — only customer_health_scores.score has business meaning."
- name: created_at
  type: DATETIME
  not_null: true
  properties:
    description: "Record creation timestamp. [time] Business timezone: Asia/Shanghai (UTC+8)."
- name: account_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to accounts — the customer organization for this contract. Join key only."
- name: opportunity_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to opportunities — the source opportunity. Join key only."
- name: owner_user_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to crm_users — the contract owner. Join key only."
primary_key: contract_id
