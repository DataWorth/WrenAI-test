name: lead_assignments
table_reference:
  catalog: ''
  schema: crm_demo
  table: lead_assignments
properties:
  description: "线索分配记录 (lead assignments) — history of lead ownership assignments to sales reps. Association/history table — not a standalone business entity."
columns:
- name: lead_assignment_id
  type: BIGINT
  not_null: true
  properties:
    description: "Primary key — unique identifier. Join key only."
- name: record_name
  type: VARCHAR(180)
  not_null: true
  properties:
    description: "分配记录名称 (assignment record name)."
- name: status
  type: VARCHAR(40)
  not_null: true
  properties:
    description: "Test placeholder status. In this association table, status is not a business metric."
- name: region
  type: VARCHAR(30)
  not_null: true
  properties:
    description: "Test placeholder region. In this association table, region is not a valid analysis dimension."
- name: source
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder source. In this association table, source is not a valid analysis dimension."
- name: industry
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder industry. In this association table, industry is not a valid analysis dimension."
- name: stage
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Test placeholder stage."
- name: amount
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "Test placeholder amount. [unit] Not a CNY business amount — do not use for revenue metrics."
- name: probability
  type: DECIMAL(6, 2)
  not_null: true
  properties:
    description: "Test placeholder probability. Not the win probability — only opportunities.probability has business meaning."
- name: quantity
  type: INT
  not_null: true
  properties:
    description: "Test placeholder quantity."
- name: unit_price
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "Test placeholder unit price."
- name: score
  type: DECIMAL(8, 2)
  not_null: true
  properties:
    description: "Test placeholder score. Not the customer health score — only customer_health_scores.score has business meaning."
- name: created_at
  type: DATETIME
  not_null: true
  properties:
    description: "Record creation timestamp. [time] Business timezone: Asia/Shanghai (UTC+8)."
- name: lead_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to leads — the assigned lead. Join key only."
- name: assigned_user_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to crm_users — the sales rep assigned. Join key only."
primary_key: lead_assignment_id
