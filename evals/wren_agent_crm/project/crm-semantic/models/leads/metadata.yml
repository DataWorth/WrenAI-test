name: leads
table_reference:
  catalog: ''
  schema: crm_demo
  table: leads
properties:
  description: "线索 (leads) —尚未转化的销售线索, representing prospects that have not yet been qualified or converted into opportunities. Each lead is a potential customer contact or organization that needs follow-up."
columns:
- name: lead_id
  type: BIGINT
  not_null: true
  properties:
    description: "Primary key — unique identifier for the lead record. Join key only, not a business document number."
- name: record_name
  type: VARCHAR(180)
  not_null: true
  properties:
    description: "线索名称 (lead name or display name)."
- name: status
  type: VARCHAR(40)
  not_null: true
  properties:
    description: "线索状态 (lead status). [enum] Valid values: 已转化 (converted to opportunity), 已合格 (qualified), 已联系 (contacted). These are the only business-meaningful lead statuses."
- name: region
  type: VARCHAR(30)
  not_null: true
  properties:
    description: "销售大区 (sales region). [enum] Valid values: 华东, 华北, 华南, 华中, 西南. Analysis dimension for lead regional distribution."
- name: source
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "获客来源 (acquisition source). [enum] Valid values: 官网咨询, 行业峰会, 渠道伙伴, 客户转介绍, 内容营销. Analysis dimension for lead source tracking."
- name: industry
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "客户所属行业 (customer industry). Analysis dimension for market segmentation."
- name: stage
  type: VARCHAR(60)
  not_null: true
  properties:
    description: "Lead stage. [enum] Demo placeholder values — not interpreted as consistent business semantics."
- name: amount
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "Test placeholder amount. [unit] Not a CNY business amount in this table — do not use for revenue metrics."
- name: probability
  type: DECIMAL(6, 2)
  not_null: true
  properties:
    description: "Test placeholder probability. Not the win probability — only opportunities.probability has business meaning."
- name: quantity
  type: INT
  not_null: true
  properties:
    description: "Test placeholder quantity."
- name: unit_price
  type: DECIMAL(18, 2)
  not_null: true
  properties:
    description: "Test placeholder unit price."
- name: score
  type: DECIMAL(8, 2)
  not_null: true
  properties:
    description: "Test placeholder score. Not the customer health score — only customer_health_scores.score has business meaning."
- name: created_at
  type: DATETIME
  not_null: true
  properties:
    description: "Record creation timestamp. [time] Business timezone: Asia/Shanghai (UTC+8)."
- name: lead_source_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to lead_sources. Join key only."
- name: lead_status_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to lead_statuses. Join key only."
- name: assigned_user_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to crm_users — the lead owner/assignee. Join key only."
- name: nurture_sequence_id
  type: BIGINT
  not_null: true
  properties:
    description: "Foreign key to nurture_sequences — the marketing nurture program. Join key only."
primary_key: lead_id
